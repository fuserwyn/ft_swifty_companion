name: SwiftyCompanion
options:
  bundleIdPrefix: fr.fortytwo
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
targets:
  SwiftyCompanion:
    type: application
    platform: iOS
    sources:
      - SwiftyCompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.fortytwo.swiftycompanion
        PRODUCT_NAME: SwiftyCompanion
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: SwiftyCompanion/Info.plist
      properties:
        CFBundleDisplayName: Student Profiler
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Filled from .env (included by Config/App.xcconfig) at build time
        IntraUID: $(INTRA_UID)
        IntraSecret: $(INTRA_SECRET)
  SwiftyCompanionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SwiftyCompanionTests
    dependencies:
      - target: SwiftyCompanion
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: fr.fortytwo.swiftycompanion.tests
schemes:
  SwiftyCompanion:
    build:
      targets:
        SwiftyCompanion: all
        SwiftyCompanionTests: [test]
    test:
      targets:
        - SwiftyCompanionTests
